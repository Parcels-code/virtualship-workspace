name: Test Binder Notebook Links

on:
  push:
    branches: [ main ]
    paths:
      - '.binder/files_to_fetch.txt'
      - '.binder/config.yaml'
      - '.binder/patch_notebooks.py'
      - 'tests/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]
  schedule:
    # run every Monday at 08:00 UTC to catch broken links automatically
    - cron: '0 8 * * 1'
  workflow_dispatch: # allow manual triggering from the Actions tab

jobs:
  test-notebook-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml

      - name: Run notebook URL and patch drift unit tests
        run: |
          pytest tests/ -v